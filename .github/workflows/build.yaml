# Builds VPN Memo Pro (skeleton flavor + OpenVPN 2) and publishes the unsigned
# release bundle/APK to the "builds" branch. Signing with the Play upload key
# happens outside of CI, so no secret is stored in this public repository.
name: Build VPN Memo Pro
permissions:
  contents: write
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Gradle settings
        run: mkdir -p ~/.gradle && echo -e "org.gradle.jvmargs=-Xmx4096M" > ~/.gradle/gradle.properties
      - name: Checkout the code
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: 25
          cache: 'gradle'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Install swig
        run: sudo apt-get update && sudo apt-get install -y swig
      - name: Build bundle and APK
        run: ./gradlew --stacktrace bundleSkeletonOvpn2Release assembleSkeletonOvpn2Release -PicsopenvpnDebugSign=true
      - name: Build unsigned bundle for Play
        run: |
          mkdir -p out
          cp main/build/outputs/bundle/skeletonOvpn2Release/*.aab out/vpnmemo-${GITHUB_RUN_NUMBER}-debugsigned.aab
          cp main/build/outputs/apk/skeletonOvpn2/release/*universal*.apk out/vpnmemo-${GITHUB_RUN_NUMBER}-debugsigned.apk || cp main/build/outputs/apk/skeletonOvpn2/release/*.apk out/ || true
          ls -la out
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vpnmemo-build
          path: out/*
      - name: Publish to builds branch
        run: |
          git config user.name "vpn-memo-ci"
          git config user.email "ci@users.noreply.github.com"
          git fetch origin builds || true
          git switch --orphan builds-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/pub && cp out/* /tmp/pub/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/pub/* .
          echo "run ${GITHUB_RUN_NUMBER} commit ${GITHUB_SHA}" > BUILD.txt
          git add -A && git commit -m "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA})"
          git push -f origin builds-tmp:builds

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: main/build/reports/**
